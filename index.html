<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Landside T4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Landside T4 | لوحة القيادة</title>
<style>
/* 
  التصميم الجديد: Executive Minimalist (احترافي، نظيف، موجه للإدارة) 
*/
:root {
  --bg: #f4f7f6;
  --surface: #ffffff;
  --primary: #0f172a;      /* كحلي غامق جداً - فاخر */
  --secondary: #334155;    /* رمادي مزرق للخطوط */
  --accent: #2563eb;       /* أزرق ساطع للأزرار */
  --success: #059669;      /* أخضر */
  --danger: #dc2626;       /* أحمر */
  --warning: #d97706;      /* برتقالي/ذهبي للمشترك */
  --border: #e2e8f0;
}

* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--secondary); padding-bottom: 50px; -webkit-font-smoothing: antialiased; }
button, input { outline: none; border: none; font: inherit; }
button { cursor: pointer; transition: 0.2s; }

/* -- الهيدر -- */
header { background: var(--primary); color: #fff; padding: 40px 20px 25px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; }
.header-content { max-width: 800px; margin: auto; display: flex; justify-content: space-between; align-items: flex-start; }
.header-titles h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.5px; }
.header-titles p { font-size: 12px; color: #94a3b8; margin: 0; }
.live-indicator { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.live-indicator::before { content: ""; width: 6px; height: 6px; background: #34d399; border-radius: 50%; animation: blink 1.5s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.clock { font-size: 11px; color: #94a3b8; margin-top: 15px; font-weight: 600; max-width: 800px; margin-left: auto; margin-right: auto; }

/* -- الحاوية الرئيسية -- */
main { max-width: 800px; margin: -15px auto 0; padding: 0 15px; position: relative; z-index: 10; }

/* -- العدادات (KPIs) -- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.kpi-card { background: var(--surface); border-radius: 16px; padding: 15px 5px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border); }
.kpi-card b { display: block; font-size: 22px; color: var(--primary); font-weight: 800; margin-bottom: 2px; }
.kpi-card span { font-size: 10px; color: #64748b; font-weight: 700; }

/* -- الأقسام البيضاء -- */
.section-card { background: var(--surface); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid var(--border); }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.section-header h2 { font-size: 16px; margin: 0; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.section-header h2::before { content: ""; width: 4px; height: 16px; background: var(--accent); border-radius: 4px; }
.section-badge { background: #f1f5f9; color: #475569; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }

/* -- نموذج الإدخال السريع -- */
.input-group { display: grid; grid-template-columns: 1fr 1fr 80px; gap: 10px; margin-bottom: 12px; }
.input-box { display: flex; flex-direction: column; gap: 5px; }
.input-box label { font-size: 11px; font-weight: 700; color: #64748b; }
.input-box input { background: #f8fafc; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; font-size: 15px; font-weight: 700; color: var(--primary); direction: ltr; transition: 0.2s; }
.input-box input:focus { border-color: var(--accent); background: #fff; }
.btn-submit { width: 100%; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; padding: 15px; border-radius: 12px; }
.btn-submit:active { transform: scale(0.98); }

/* -- كروت الرحلات (نظيفة ومرتبة) -- */
.flight-group { border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; background: #fff; }
.flight-header { background: #f8fafc; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.flight-title { font-size: 16px; font-weight: 800; color: var(--primary); direction: ltr; margin-bottom: 2px; }
.flight-meta { font-size: 11px; font-weight: 600; color: #64748b; }
.flight-timer { background: #fff; border: 1px solid var(--border); padding: 5px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; color: var(--primary); }

/* -- الباصات داخل الرحلة -- */
.bus-list { padding: 10px; display: grid; grid-template-columns: 1fr; gap: 10px; }
@media(min-width: 600px) { .bus-list { grid-template-columns: 1fr 1fr; } }
.bus-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; position: relative; background: #fff; }
.bus-item.late { border-right: 4px solid var(--danger); }
.bus-item.early { border-right: 4px solid var(--success); }
.bus-item.normal { border-right: 4px solid #3b82f6; }

.bus-row-1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.bus-id { font-size: 13px; font-weight: 800; color: var(--primary); }
.bus-pax { background: #f1f5f9; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--primary); }

.bus-row-2 { display: flex; gap: 6px; margin-bottom: 8px; }
.bus-stat { flex: 1; background: #f8fafc; border-radius: 8px; padding: 6px; text-align: center; }
.bus-stat.highlight { background: #eff6ff; color: #1d4ed8; }
.bus-item.late .bus-stat.highlight { background: #fef2f2; color: var(--danger); }
.bus-item.early .bus-stat.highlight { background: #ecfdf5; color: var(--success); }
.bus-stat span { display: block; font-size: 9px; color: #64748b; font-weight: 600; margin-bottom: 2px; }
.bus-stat b { font-size: 12px; font-weight: 800; }

.bus-tags { display: flex; gap: 5px; margin-bottom: 8px; }
.badge { padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; }
.badge.late { background: #fef2f2; color: var(--danger); }
.badge.early { background: #ecfdf5; color: var(--success); }
.badge.normal { background: #eff6ff; color: #3b82f6; }
.badge.shared { background: #fffbeb; color: var(--warning); border: 1px solid #fef3c7; }

/* -- قائمة الإجراءات المخفية (للنظافة البصرية) -- */
details.actions-toggle { margin-top: 5px; }
details.actions-toggle summary { font-size: 10px; font-weight: 700; color: var(--accent); cursor: pointer; outline: none; background: #f8fafc; padding: 6px; border-radius: 8px; text-align: center; list-style: none; }
details.actions-toggle summary::-webkit-details-marker { display: none; }
.action-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.action-buttons button { flex: 1; padding: 8px; border-radius: 8px; font-size: 10px; font-weight: 700; }
.btn-go { background: #ecfdf5; color: var(--success); border: 1px solid #d1fae5; }
.btn-shared { background: #fffbeb; color: var(--warning); border: 1px solid #fef3c7; }
.btn-del { background: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; }
.shared-list { background: #f8fafc; border-radius: 8px; padding: 6px; margin-top: 8px; font-size: 10px; font-weight: 600; }
.shared-row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
.shared-row:last-child { border: none; margin: 0; padding: 0; }
.shared-row button { color: var(--danger); background: none; font-size: 12px; padding: 0 5px; }

.add-bus-btn { width: 100%; background: #f8fafc; color: var(--primary); padding: 12px; font-size: 11px; font-weight: 700; border-top: 1px solid var(--border); }
.add-bus-btn:hover { background: #f1f5f9; }

/* -- تقرير واتساب والأدوات -- */
.tools-grid { display: flex; gap: 8px; margin-bottom: 12px; }
.tools-grid button, .tools-grid label { flex: 1; text-align: center; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; background: #f1f5f9; color: var(--primary); }
.tools-grid button.primary-btn { background: var(--accent); color: #fff; }
.report-preview { background: #f8fafc; border: 1px solid var(--border); padding: 15px; border-radius: 12px; font-size: 11px; line-height: 1.8; white-space: pre-wrap; font-family: monospace; color: var(--primary); max-height: 200px; overflow-y: auto; margin-top: 10px; }

/* -- المغادرون -- */
.departed-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.departed-item:last-child { border: none; padding-bottom: 0; }
.dep-info { display: flex; flex-direction: column; gap: 3px; }
.dep-flight { font-size: 13px; font-weight: 800; color: var(--primary); }
.dep-meta { font-size: 10px; font-weight: 600; color: #64748b; }
.dep-actions { display: flex; gap: 5px; }
.dep-actions button { padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; }
.dep-actions .btn-restore { background: #f1f5f9; color: var(--primary); }

.notice { text-align: center; color: var(--success); font-size: 11px; font-weight: 700; margin-top: 8px; min-height: 16px; }
.empty-state { text-align: center; padding: 25px; color: #94a3b8; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-titles">
      <h1>Landside T4</h1>
      <p>عمليات الساحات الخارجية · منطقة الفرز</p>
    </div>
    <div class="live-indicator">مباشر</div>
  </div>
  <div class="clock" id="clock"></div>
</header>

<main>
  <!-- مؤشرات الأداء العليا -->
  <div class="kpi-grid">
    <div class="kpi-card"><b id="kbus">0</b><span>باص بالفرز</span></div>
    <div class="kpi-card"><b id="kpax">0</b><span>إجمالي الركاب</span></div>
    <div class="kpi-card"><b id="kflight">0</b><span>رحلة نشطة</span></div>
    <div class="kpi-card"><b id="klate">0</b><span>محضر متأخر</span></div>
  </div>

  <!-- نموذج التسجيل -->
  <div class="section-card">
    <div class="section-header">
      <h2>تسجيل باص للفرز</h2>
      <span class="section-badge" id="nextflight">—</span>
    </div>
    <form id="entry">
      <div class="input-group">
        <div class="input-box"><label>الرحلة</label><input id="flight" placeholder="SV123" maxlength="14" autocapitalize="characters" required></div>
        <div class="input-box"><label>الإقلاع</label><input id="time" type="time" required></div>
        <div class="input-box"><label>الركاب</label><input id="pax" type="number" min="1" max="150" inputmode="numeric" placeholder="48" required></div>
      </div>
      <button type="submit" class="btn-submit">تأكيد وتسجيل الباص</button>
      <div id="notice" class="notice"></div>
    </form>
  </div>

  <!-- الباصات الحالية -->
  <div class="section-card">
    <div class="section-header">
      <h2>لوحة المراقبة (الباصات الحالية)</h2>
    </div>
    <div id="active"></div>
  </div>

  <!-- التقارير والأدوات -->
  <div class="section-card">
    <div class="section-header"><h2>التقارير والنسخ الاحتياطي</h2></div>
    <div class="tools-grid">
      <button id="copy" type="button">نسخ التقرير</button>
      <button id="share" type="button" class="primary-btn">مشاركة للواتساب</button>
    </div>
    <div class="tools-grid">
      <button id="backup" type="button">حفظ نسخة</button>
      <label>استعادة<input type="file" id="restorefile" accept=".json,application/json" style="display:none"></label>
    </div>
    <details style="margin-top:10px;">
      <summary style="font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;outline:none;">عرض معاينة تقرير المشرف ▾</summary>
      <div id="preview" class="report-preview"></div>
    </details>
  </div>

  <!-- الباصات المغادرة -->
  <div class="section-card">
    <div class="section-header">
      <h2>سجل المغادرة</h2>
      <span class="section-badge" id="donecount">0 باص</span>
    </div>
    <div id="done"></div>
  </div>
</main>

<script>
(()=>{'use strict';
const KEY='landside-t4-personal-v1', $=id=>document.getElementById(id);
let buses=[];
try{ const v=JSON.parse(localStorage.getItem(KEY)||'[]'); if(Array.isArray(v))buses=v; }catch(e){}

const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function parts(d){return Object.fromEntries(fmt.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]))}
function departure(t, refMs){
  const base=refMs?new Date(Number(refMs)):new Date();
  const p=parts(base),[h,m]=String(t||'00:00').split(':').map(Number);
  let d=Date.UTC(p.year,p.month-1,p.day,h-3,m);
  if(d<base.getTime()-60000)d+=86400000;
  return d;
}

function created(b){return Number(b.createdAt)||Number(String(b.id).slice(0,13))||Date.now()}
function dep(b){return Number(b.departure)||departure(b.time,created(b))}
function mins(ms){const n=Math.max(0,Math.floor(ms/60000));return Math.floor(n/60)+'س '+(n%60)+'د'}
function until(b){const d=dep(b)-Date.now();return d<=0?'حان الإقلاع':mins(d)}

function classification(b){
  const diff=dep(b)-created(b);
  if(diff<18000000)return 'late';
  if(diff>21600000)return 'early';
  return 'normal';
}
function classLabel(c){ return c==='late'?'متأخر':c==='early'?'مبكر':'عادي'; }
function total(b){return Number(b.pax||0)+(Array.isArray(b.extra)?b.extra:[]).reduce((a,x)=>a+Number(x.pax||0),0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(buses));return true}catch(e){alert('تعذر الحفظ.');return false}}
function newId(){return String(Date.now())+Math.random().toString(36).slice(2)}
function groupKey(b){return String(b.flight).toUpperCase()+'|'+String(b.time)}
function groupBy(a){const m=new Map();for(const b of a){const k=groupKey(b);if(!m.has(k))m.set(k,[]);m.get(k).push(b)}return [...m.values()]}
function formatArTime(ms){return new Intl.DateTimeFormat('ar-SA',{timeZone:'Asia/Riyadh',timeStyle:'short'}).format(new Date(ms))}

function busCard(b,i){
  const c=classification(b), extras=Array.isArray(b.extra)?b.extra:[];
  let sharedHtml = '';
  if(extras.length) {
    sharedHtml = `<div class="shared-list">` + extras.map((x,j)=>`
      <div class="shared-row">
        <span>مشترك: ${esc(x.flight)} (${x.pax} راكب) - ${esc(x.time)}</span>
        <button data-action="removeextra" data-id="${esc(b.id)}" data-index="${j}">✖</button>
      </div>`).join('') + `</div>`;
  }

  return `<div class="bus-item ${c}">
    <div class="bus-row-1">
      <span class="bus-id">باص ${i+1}</span>
      <span class="bus-pax">${total(b)} راكب</span>
    </div>
    <div class="bus-row-2">
      <div class="bus-stat"><span>ثابت</span><b>${mins(dep(b)-created(b))}</b></div>
      <div class="bus-stat highlight"><span>بالفرز</span><b data-wait="${esc(b.id)}">${mins(Date.now()-created(b))}</b></div>
    </div>
    <div class="bus-tags">
      <span class="badge ${c}">تصنيف: ${classLabel(c)}</span>
      ${extras.length?`<span class="badge shared">مشترك (+${extras.length})</span>`:''}
    </div>
    
    <details class="actions-toggle">
      <summary>إظهار التفاصيل والإجراءات</summary>
      <div style="font-size:10px; color:#64748b; margin-top:8px;">وصول: ${formatArTime(created(b))} | ركاب الأساسية: ${b.pax}</div>
      ${sharedHtml}
      <div class="action-buttons">
        <button class="btn-shared" data-action="addextra" data-id="${esc(b.id)}">+ رحلة مشتركة</button>
        <button class="btn-go" data-action="done" data-id="${esc(b.id)}">المغادرة ✓</button>
        <button class="btn-del" data-action="delete" data-id="${esc(b.id)}">حذف</button>
      </div>
    </details>
  </div>`;
}

function render(){
  const active=buses.filter(b=>!b.done), done=buses.filter(b=>b.done), groups=groupBy(active);
  $('kbus').textContent=active.length;
  $('kpax').textContent=active.reduce((a,b)=>a+total(b),0);
  $('kflight').textContent=new Set(active.flatMap(b=>[b.flight,...(b.extra||[]).map(x=>x.flight)])).size;
  $('klate').textContent=active.filter(b=>classification(b)==='late').length;
  $('donecount').textContent=done.length + ' باص';

  $('active').innerHTML=groups.length?groups.map(g=>{
    const b=g[0], p=g.reduce((a,x)=>a+total(x),0);
    return `<div class="flight-group">
      <div class="flight-header">
        <div>
          <div class="flight-title">${esc(b.flight)}</div>
          <div class="flight-meta">إقلاع ${esc(b.time)} · ${g.length} باص · ${p} راكب</div>
        </div>
        <div class="flight-timer" data-live="${esc(b.id)}">${until(b)}</div>
      </div>
      <div class="bus-list">${g.map((x,i)=>busCard(x,i)).join('')}</div>
      <button class="add-bus-btn" data-action="addsame" data-id="${esc(b.id)}">+ إضافة باص جديد لنفس الرحلة</button>
    </div>`;
  }).join('') : '<div class="empty-state">الفرز فارغ حالياً. لا توجد باصات.</div>';

  $('done').innerHTML=done.length?done.slice().reverse().map(b=>{
    const waitMs=(b.doneAt?new Date(b.doneAt).getTime():Date.now())-created(b);
    const extras=Array.isArray(b.extra)?b.extra:[];
    return `<div class="departed-item">
      <div class="dep-info">
        <span class="dep-flight">${esc(b.flight)} <span style="font-weight:600; color:#64748b;">· ${total(b)} راكب · إقلاع ${esc(b.time)}</span> ${extras.length?`<span class="badge shared">مشترك</span>`:''}</span>
        <span class="dep-meta">الانتظار: ${mins(waitMs)} | غادر: ${b.doneAt?formatArTime(b.doneAt):'—'}</span>
      </div>
      <div class="dep-actions">
        <button class="btn-restore" data-action="restore" data-id="${esc(b.id)}">تراجع</button>
        <button class="btn-del" data-action="delete" data-id="${esc(b.id)}">حذف</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty-state">لم يغادر أي باص حتى الآن.</div>';

  $('preview').textContent=report();
  tick();
}

function tick(){
  const lookup=new Map(buses.map(b=>[String(b.id),b]));
  document.querySelectorAll('[data-live]').forEach(el=>{const b=lookup.get(el.dataset.live);if(b)el.textContent=until(b)});
  document.querySelectorAll('[data-wait]').forEach(el=>{const b=lookup.get(el.dataset.wait);if(b)el.textContent=mins((b.done&&b.doneAt?new Date(b.doneAt).getTime():Date.now())-created(b))});

  const active=buses.filter(b=>!b.done);
  const upcoming=active.flatMap(b=>[
    {flight:b.flight,dep:dep(b)},
    ...(b.extra||[]).map(x=>({flight:x.flight,dep:Number(x.departure)||departure(x.time,created(b))}))
  ]).filter(x=>x.dep>Date.now()).sort((a,b)=>a.dep-b.dep);
  $('nextflight').textContent=upcoming.length?`أقرب رحلة: ${upcoming[0].flight} (${mins(upcoming[0].dep-Date.now())})`:'لا توجد رحلات مجدولة';

  $('clock').textContent=new Intl.DateTimeFormat('ar-SA',{timeZone:'Asia/Riyadh',dateStyle:'full',timeStyle:'short'}).format(new Date());
}

/* 
  تعديل تقرير الواتساب بناءً على طلبك ليكون مختصراً جداً وذكياً:
  1- باص واحد لرحلة واحدة = سطر واحد.
  2- عدة باصات لنفس الرحلة = أرقام الركاب بجانب بعضها.
  3- رحلات مشتركة = تفصل لتوضيحها.
*/
function report(){
  const a=buses.filter(b=>!b.done), done=buses.filter(b=>b.done), groups=groupBy(a);
  const lines = [
    '📋 *تقرير الفرز T4 - عمليات الساحات*',
    '🕒 ' + formatArTime(Date.now()),
    '',
    '📊 إجمالي الباصات: ' + a.length + ' | الركاب: ' + a.reduce((n,b)=>n+total(b),0),
    '━━━━━━━━━━━━━'
  ];

  if (!groups.length) {
    lines.push('لا توجد باصات في الفرز حالياً.');
  } else {
    for (const g of groups) {
      const f = g[0];
      const hasShared = g.some(b => b.extra && b.extra.length > 0);

      if (g.length === 1 && !hasShared) {
        // حالة 1: باص واحد لرحلة واحدة
        lines.push(`✈️ الرحلة: *${f.flight}* | إقلاع: ${f.time} | الركاب: ${f.pax}`);
      } 
      else if (!hasShared) {
        // حالة 2: عدة باصات لنفس الرحلة (بدون مشترك) -> الأرقام جنب بعض
        const paxList = g.map(b => b.pax).join(' ، ');
        const totalPax = g.reduce((sum, b) => sum + b.pax, 0);
        lines.push(`✈️ الرحلة: *${f.flight}* | إقلاع: ${f.time}`);
        lines.push(`   🚌 الركاب: ${paxList} (${g.length} باصات) | الإجمالي: ${totalPax}`);
      } 
      else {
        // حالة 3: باصات تحتوي على رحلات مشتركة
        lines.push(`✈️ الرحلة: *${f.flight}* | إقلاع: ${f.time} | الباصات: ${g.length}`);
        g.forEach((b, i) => {
          const ex = Array.isArray(b.extra) ? b.extra : [];
          if (!ex.length) {
             lines.push(`   - باص ${i+1}: ${b.pax} راكب`);
          } else {
             let sharedStr = ex.map(x => `${x.flight} (${x.pax})`).join(' + ');
             lines.push(`   - باص ${i+1}: ${b.pax} راكب + المشترك [${sharedStr}] | الإجمالي: ${total(b)}`);
          }
        });
      }
      lines.push(''); // سطر فارغ بين كل رحلة والأخرى للترتيب
    }
  }
  return '\u200f' + lines.join('\n\u200f');
}

$('entry').addEventListener('submit',e=>{
  e.preventDefault();
  const flight=$('flight').value.trim().toUpperCase().replace(/\s+/g,''),time=$('time').value,pax=Number($('pax').value);
  if(!/^[A-Z0-9-\u0600-\u06FF]{2,14}$/.test(flight)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)||!Number.isInteger(pax)||pax<1||pax>150){
    alert('تأكد من إدخال البيانات بشكل صحيح');return;
  }
  buses.push({id:newId(),flight,time,pax,departure:departure(time,Date.now()),createdAt:Date.now(),done:false,extra:[]});
  if(!save()){buses.pop();return}
  e.target.reset();
  $('notice').textContent='✓ تم تسجيل الباص';
  setTimeout(()=>{if($('notice'))$('notice').textContent=''},2500);
  render();
});

$('flight').addEventListener('input',()=>{
  const f=$('flight').value.trim().toUpperCase().replace(/\s+/g,'');
  const b=buses.find(b=>!b.done&&b.flight===f);
  if(b&&!$('time').value)$('time').value=b.time;
});

function action(e){
  const btn=e.target.closest('button[data-action]');
  if(!btn)return;
  const a=btn.dataset.action,b=buses.find(b=>String(b.id)===btn.dataset.id);
  if(!b)return;

  if(a==='addsame'){
    const val=prompt('تسجيل باص جديد للرحلة '+b.flight+'\nأدخل عدد الركاب فقط:');
    if(val===null)return;
    const pax=Number(val.trim());
    if(!Number.isInteger(pax)||pax<1||pax>150){alert('رقم غير صحيح');return}
    buses.push({id:newId(),flight:b.flight,time:b.time,pax,departure:dep(b),createdAt:Date.now(),done:false,extra:[]});
  }
  else if(a==='addextra'){
    const f=prompt('رقم الرحلة المشتركة:');if(f===null)return;
    const flight=f.trim().toUpperCase().replace(/\s+/g,'');
    if(!/^[A-Z0-9-\u0600-\u06FF]{2,18}$/.test(flight)){alert('رقم الرحلة غير صحيح');return}
    const time=prompt('وقت إقلاع الرحلة المشتركة (مثال 15:30):');if(time===null)return;
    if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time.trim())){alert('وقت غير صحيح');return}
    const val=prompt('عدد الركاب للرحلة المشتركة:');if(val===null)return;
    const pax=Number(val.trim());
    if(!Number.isInteger(pax)||pax<1||pax>150){alert('عدد ركاب غير صحيح');return}
    (b.extra||(b.extra=[])).push({flight,time:time.trim(),pax,departure:departure(time.trim(),created(b)),createdAt:Date.now()});
  }
  else if(a==='removeextra'){
    if(!confirm('هل تريد حذف هذه الرحلة المشتركة من الباص؟'))return;
    b.extra.splice(Number(btn.dataset.index),1);
  }
  else if(a==='done'){ b.done=true; b.doneAt=new Date().toISOString(); }
  else if(a==='restore'){ b.done=false; delete b.doneAt; }
  else if(a==='delete'){
    if(!confirm('هل أنت متأكد من حذف هذا الباص بالكامل؟'))return;
    buses=buses.filter(x=>x!==b);
  }
  const old=localStorage.getItem(KEY);
  if(!save()){try{buses=JSON.parse(old||'[]')}catch(e){}return}
  render();
}

$('active').addEventListener('click',action);
$('done').addEventListener('click',action);

async function copy(){ try{await navigator.clipboard.writeText(report());alert('تم نسخ التقرير ✓')}catch(e){prompt('انسخ التقرير:',report())} }
$('copy').onclick=copy;
$('share').onclick=async()=>{ if(navigator.share){try{await navigator.share({text:report()})}catch(e){}}else await copy(); };
$('backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(buses,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='landside-t4-backup.json';a.click(); setTimeout(()=>URL.revokeObjectURL(url),3000);
};
$('restorefile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const v=JSON.parse(await f.text());
    if(!Array.isArray(v)||!v.every(b=>b&&typeof b==='object'&&typeof b.flight==='string'&&typeof b.time==='string'))throw Error();
    if(!confirm('سيتم استعادة النسخة الاحتياطية. تأكيد؟'))return;
    const old=buses;buses=v;
    if(!save()){buses=old;return}
    render();alert('تم استعادة البيانات بنجاح ✓');
  }catch(err){alert('ملف النسخة غير صحيح.')}
  finally{e.target.value=''}
});

render(); setInterval(tick,1000);
})();
