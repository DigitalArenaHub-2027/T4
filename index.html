<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Landside T4">
<!-- الأيقونة يتم توليدها برمجياً لتعطي شكل باص عند التثبيت -->
<link id="dynamic-favicon" rel="apple-touch-icon" href="">
<title>Landside T4 | إدارة عمليات الفرز</title>
<style>
/* المتغيرات */
:root {
  --bg-color: #f1f5f9;
  --surface: #ffffff;
  --primary: #0b1b3d;
  --primary-light: #1e3a8a;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --late: #b91c1c;
  --late-bg: #fef2f2;
  --early: #047857;
  --early-bg: #ecfdf5;
  --normal: #1d4ed8;
  --normal-bg: #eff6ff;
  --shared: #b45309;
  --shared-bg: #fffbeb;
}

* { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { margin: 0; background: var(--bg-color); color: var(--text-main); -webkit-font-smoothing: antialiased; padding-bottom: 60px; }
button, input { outline: none; border: none; font: inherit; margin: 0; }
button { cursor: pointer; transition: 0.2s ease; }

/* رأس الصفحة */
header { background: var(--primary); color: #fff; padding: 45px 20px 25px; position: relative; box-shadow: 0 4px 20px rgba(11,27,61,0.15); border-bottom: 4px solid #cbd5e1; }
.header-wrap { max-width: 800px; margin: auto; display: flex; justify-content: space-between; align-items: flex-end; }
.header-titles h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.5px; text-transform: uppercase; }
.header-titles p { font-size: 12px; color: #94a3b8; margin: 0; font-weight: 500; letter-spacing: 0.5px; }
.status-indicator { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
.status-indicator::before { content: ""; width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
#clock { font-size: 12px; font-weight: 600; margin-top: 15px; color: #cbd5e1; max-width: 800px; margin-left: auto; margin-right: auto; padding: 0 20px; }

/* الحاوية */
main { max-width: 800px; margin: 15px auto 0; padding: 0 15px; }

/* الإحصائيات */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); padding: 16px 8px; text-align: center; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
.kpi-card b { display: block; font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
.kpi-card span { font-size: 10px; color: var(--text-muted); font-weight: 700; }

/* اللوحات */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.03); }
.panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg-color); padding-bottom: 12px; margin-bottom: 16px; }
.panel-header h2 { font-size: 15px; font-weight: 800; margin: 0; color: var(--primary); }
.panel-badge { font-size: 11px; font-weight: 700; color: var(--primary-light); background: var(--bg-color); padding: 4px 10px; border-radius: 6px; }

/* نماذج الإدخال (تمت موازنة الأحجام لتطابق بعضها 100%) */
.form-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field label { font-size: 12px; font-weight: 800; color: var(--primary-light); }
.form-field input { 
  width: 100%; 
  height: 52px; /* توحيد الارتفاع لكل الحقول */
  border: 2px solid #cbd5e1; 
  border-radius: 10px; 
  padding: 0 14px; 
  font-size: 17px; 
  font-weight: 800; 
  text-align: center; 
  color: var(--primary); 
  background: #f8fafc; 
  direction: ltr; 
  transition: 0.2s;
  -webkit-appearance: none; /* إزالة تنسيقات الآيفون الافتراضية التي تسبب تكبير حقل الوقت */
}
.form-field input:focus { border-color: var(--primary-light); background: #fff; box-shadow: 0 0 0 3px rgba(30,58,138,0.1); }
.btn-primary { width: 100%; background: var(--primary); color: #fff; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; box-shadow: 0 4px 12px rgba(11,27,61,0.2); }
.btn-primary:active { transform: translateY(2px); box-shadow: none; }
.notice { text-align: center; font-size: 12px; font-weight: 800; color: var(--early); margin-top: 8px; min-height: 16px; }

/* الرحلات والباصات */
.flight-block { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; background: #fff; }
.flight-head { background: #f8fafc; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); }
.flight-title { font-size: 18px; font-weight: 900; color: var(--primary); direction: ltr; letter-spacing: 1px; margin-bottom: 4px; }
.flight-info { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
.flight-pax-highlight { font-size: 13px; font-weight: 800; color: var(--primary-light); }
.flight-countdown { border: 1px solid #cbd5e1; background: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 900; color: var(--primary); text-align: center; }

.buses-container { padding: 12px; display: grid; grid-template-columns: 1fr; gap: 12px; }
@media(min-width: 600px) { .buses-container { grid-template-columns: 1fr 1fr; } }
.bus-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: #fff; position: relative; }
.bus-card.late { border-right: 4px solid var(--late); }
.bus-card.early { border-right: 4px solid var(--early); }
.bus-card.normal { border-right: 4px solid var(--normal); }

.bus-top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.bus-number { font-size: 15px; font-weight: 900; color: var(--primary); }
.bus-pax { font-size: 13px; font-weight: 800; color: var(--text-main); }

.bus-stats { display: flex; gap: 8px; margin-bottom: 10px; }
.stat-box { flex: 1; background: #f8fafc; border: 1px solid #f1f5f9; padding: 8px; border-radius: 6px; text-align: center; }
.stat-box span { display: block; font-size: 10px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
.stat-box b { font-size: 13px; font-weight: 800; direction: ltr; }
.stat-box.highlight { background: var(--normal-bg); color: var(--normal); }
.bus-card.late .stat-box.highlight { background: var(--late-bg); color: var(--late); }
.bus-card.early .stat-box.highlight { background: var(--early-bg); color: var(--early); }

.bus-tags { display: flex; gap: 6px; margin-bottom: 10px; }
.bus-tag { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 4px; }
.bus-tag.late { background: var(--late-bg); color: var(--late); }
.bus-tag.early { background: var(--early-bg); color: var(--early); }
.bus-tag.normal { background: var(--normal-bg); color: var(--normal); }
.bus-tag.shared { background: var(--shared-bg); color: var(--shared); border: 1px solid #fef3c7; }

/* الإجراءات */
details.actions-menu summary { font-size: 12px; font-weight: 800; color: var(--primary-light); cursor: pointer; background: var(--bg-color); padding: 10px; border-radius: 6px; text-align: center; list-style: none; }
details.actions-menu summary::-webkit-details-marker { display: none; }
.action-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.action-grid button { flex: 1; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 800; }
.btn-action { background: #fff; border: 1px solid #cbd5e1; color: var(--text-main); }
.btn-action.success { background: var(--early-bg); border-color: #a7f3d0; color: var(--early); }
.btn-action.danger { background: var(--late-bg); border-color: #fecaca; color: var(--late); flex: 0.5; }

.shared-block { background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-top: 10px; font-size: 11px; font-weight: 700; color: var(--text-main); }
.shared-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
.shared-item:last-child { border: none; padding-bottom: 0; }
.shared-item button { background: none; color: var(--late); font-weight: 900; font-size: 14px; }

.add-bus-btn { width: 100%; background: #f8fafc; color: var(--primary-light); padding: 16px; font-size: 13px; font-weight: 800; border-top: 1px solid var(--border); }
.add-bus-btn:hover { background: var(--bg-color); }

/* الأدوات والتقارير */
.tools-row { display: flex; gap: 10px; margin-bottom: 12px; }
.tools-row button, .tools-row label { flex: 1; text-align: center; padding: 14px; border-radius: 8px; font-size: 13px; font-weight: 800; background: var(--bg-color); color: var(--text-main); cursor: pointer; border: 1px solid #cbd5e1; }
.tools-row button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.report-view { background: #f8fafc; border: 1px solid var(--border); padding: 16px; border-radius: 8px; font-size: 12px; line-height: 2; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text-main); max-height: 250px; overflow-y: auto; margin-top: 12px; direction: rtl; text-align: right; font-weight: 600; }

/* المغادرة */
.dep-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
.dep-row:last-child { border: none; padding-bottom: 0; }
.dep-info { display: flex; flex-direction: column; gap: 6px; }
.dep-flight { font-size: 16px; font-weight: 900; color: var(--primary); }
.dep-details { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.dep-btns { display: flex; gap: 6px; }
.dep-btns button { padding: 10px 14px; border-radius: 8px; font-size: 11px; font-weight: 800; border: 1px solid #cbd5e1; background: #fff; color: var(--text-main); }

.empty-msg { text-align: center; padding: 30px 10px; color: var(--text-muted); font-size: 13px; font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <div class="header-titles">
      <h1>Landside T4</h1>
      <p>إدارة عمليات الساحات والفرز</p>
    </div>
    <div class="status-indicator">الشبكة متصلة</div>
  </div>
  <div id="clock">جاري التحميل...</div>
</header>

<main>
  <!-- العدادات -->
  <div class="kpi-grid">
    <div class="kpi-card"><b id="kbus">0</b><span>باص بالفرز</span></div>
    <div class="kpi-card"><b id="kpax">0</b><span>إجمالي الركاب</span></div>
    <div class="kpi-card"><b id="kflight">0</b><span>رحلة نشطة</span></div>
    <div class="kpi-card"><b id="klate">0</b><span>تأخير تحضير</span></div>
  </div>

  <!-- تسجيل باص (تحت بعض وموزونة 100%) -->
  <section class="panel">
    <div class="panel-header">
      <h2>تسجيل باص جديد</h2>
      <span class="panel-badge" id="nextflight">الرحلة القادمة: —</span>
    </div>
    <form id="entry">
      <div class="form-grid">
        <div class="form-field">
          <label>رقم الرحلة</label>
          <input id="flight" placeholder="SV123" maxlength="14" autocapitalize="characters" required>
        </div>
        <div class="form-field">
          <label>وقت الإقلاع</label>
          <input id="time" type="time" required>
        </div>
        <div class="form-field">
          <label>عدد الركاب</label>
          <input id="pax" type="number" min="1" max="150" inputmode="numeric" placeholder="48" required>
        </div>
      </div>
      <button type="submit" class="btn-primary">حفظ وتسجيل البيانات</button>
      <div id="notice" class="notice"></div>
    </form>
  </section>

  <!-- الباصات الحالية -->
  <section class="panel">
    <div class="panel-header">
      <h2>لوحة المراقبة التشغيلية</h2>
    </div>
    <div id="active"></div>
  </section>

  <!-- إدارة التقارير -->
  <section class="panel">
    <div class="panel-header"><h2>التقارير والنسخ الاحتياطي</h2></div>
    <div class="tools-row">
      <button id="copy" type="button">نسخ التقرير</button>
      <button id="share" type="button" class="primary">إرسال التقرير (واتساب)</button>
    </div>
    <div class="tools-row">
      <button id="backup" type="button">تصدير نسخة احتياطية</button>
      <label>استيراد نسخة<input type="file" id="restorefile" accept=".json,application/json" style="display:none"></label>
    </div>
    <details style="margin-top:16px;">
      <summary style="font-size:13px;font-weight:800;color:var(--primary-light);cursor:pointer;">استعراض تقرير المشرف ▾</summary>
      <div id="preview" class="report-view"></div>
    </details>
  </section>

  <!-- سجل المغادرة -->
  <section class="panel">
    <div class="panel-header">
      <h2>سجل الباصات المغادرة</h2>
      <span class="panel-badge" id="donecount">0 باص</span>
    </div>
    <div id="done"></div>
  </section>
</main>

<script>
(()=>{'use strict';
// -- توليد أيقونة التطبيق (الباص) برمجياً عند التثبيت --
function generateAppIcon() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#0b1b3d';
  ctx.fillRect(0, 0, 512, 512);
  
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(80, 100, 352, 200, 30);
  ctx.fill();
  
  ctx.fillStyle = '#0b1b3d';
  ctx.fillRect(100, 120, 80, 70);
  ctx.fillRect(216, 120, 80, 70);
  ctx.fillRect(332, 120, 80, 70);
  
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath(); ctx.arc(160, 300, 45, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(350, 300, 45, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 65px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('LANDSIDE', 256, 400);
  ctx.fillStyle = '#34d399';
  ctx.fillText('T4', 256, 470);
  
  const link = document.getElementById('dynamic-favicon');
  if(link) link.href = canvas.toDataURL('image/png');
}
generateAppIcon();

const KEY='landside-t4-personal-v1', $=id=>document.getElementById(id);
let buses=[];
try{ const v=JSON.parse(localStorage.getItem(KEY)||'[]'); if(Array.isArray(v))buses=v; }catch(e){}

const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function parts(d){return Object.fromEntries(fmt.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]))}
function departure(t, refMs){
  const base=refMs?new Date(Number(refMs)):new Date();
  const p=parts(base),[h,m]=String(t||'00:00').split(':').map(Number);
  let d=Date.UTC(p.year,p.month-1,p.day,h-3,m);
  if(d<base.getTime()-60000)d+=86400000;
  return d;
}

function created(b){return Number(b.createdAt)||Number(String(b.id).slice(0,13))||Date.now()}
function dep(b){return Number(b.departure)||departure(b.time,created(b))}
function mins(ms){const n=Math.max(0,Math.floor(ms/60000));return Math.floor(n/60)+'س '+(n%60)+'د'}
function until(b){const d=dep(b)-Date.now();return d<=0?'حان الإقلاع':mins(d)}

function classification(b){
  const diff=dep(b)-created(b);
  if(diff<18000000)return 'late';
  if(diff>21600000)return 'early';
  return 'normal';
}
function classLabel(c){ return c==='late'?'متأخر':c==='early'?'مبكر':'عادي'; }
function total(b){return Number(b.pax||0)+(Array.isArray(b.extra)?b.extra:[]).reduce((a,x)=>a+Number(x.pax||0),0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(buses));return true}catch(e){alert('تعذر الحفظ.');return false}}
function newId(){return String(Date.now())+Math.random().toString(36).slice(2)}
function groupKey(b){return String(b.flight).toUpperCase()+'|'+String(b.time)}
function groupBy(a){const m=new Map();for(const b of a){const k=groupKey(b);if(!m.has(k))m.set(k,[]);m.get(k).push(b)}return [...m.values()]}
function formatArTime(ms){return new Intl.DateTimeFormat('ar-SA',{timeZone:'Asia/Riyadh',timeStyle:'short'}).format(new Date(ms))}

function busCard(b,i){
  const c=classification(b), extras=Array.isArray(b.extra)?b.extra:[];
  let sharedHtml = '';
  if(extras.length) {
    sharedHtml = `<div class="shared-block">` + extras.map((x,j)=>`
      <div class="shared-item">
        <span>مشترك: ${esc(x.flight)} (الركاب: ${x.pax})</span>
        <button data-action="removeextra" data-id="${esc(b.id)}" data-index="${j}">✕</button>
      </div>`).join('') + `</div>`;
  }

  return `<div class="bus-card ${c}">
    <div class="bus-top">
      <span class="bus-number">باص رقم ${i+1}</span>
      <span class="bus-pax">الركاب: ${total(b)}</span>
    </div>
    <div class="bus-stats">
      <div class="stat-box"><span>التحضير</span><b>${mins(dep(b)-created(b))}</b></div>
      <div class="stat-box highlight"><span>بالفرز</span><b data-wait="${esc(b.id)}">${mins(Date.now()-created(b))}</b></div>
    </div>
    <div class="bus-tags">
      <span class="bus-tag ${c}">الحالة: ${classLabel(c)}</span>
      ${extras.length?`<span class="bus-tag shared">مشترك (+${extras.length})</span>`:''}
    </div>
    <details class="actions-menu">
      <summary>عرض الإجراءات</summary>
      <div style="font-size:12px; color:var(--text-muted); margin-top:8px; font-weight:700;">
        وقت الوصول: ${formatArTime(created(b))}<br>
        الركاب (أساسي): ${b.pax}
      </div>
      ${sharedHtml}
      <div class="action-grid">
        <button class="btn-action" data-action="addextra" data-id="${esc(b.id)}">+ رحلة مشتركة</button>
        <button class="btn-action success" data-action="done" data-id="${esc(b.id)}">المغادرة ✓</button>
        <button class="btn-action danger" data-action="delete" data-id="${esc(b.id)}">حذف</button>
      </div>
    </details>
  </div>`;
}

function render(){
  const active=buses.filter(b=>!b.done), done=buses.filter(b=>b.done), groups=groupBy(active);
  $('kbus').textContent=active.length;
  $('kpax').textContent=active.reduce((a,b)=>a+total(b),0);
  $('kflight').textContent=new Set(active.flatMap(b=>[b.flight,...(b.extra||[]).map(x=>x.flight)])).size;
  $('klate').textContent=active.filter(b=>classification(b)==='late').length;
  $('donecount').textContent=done.length + ' باص';

  $('active').innerHTML=groups.length?groups.map(g=>{
    const b=g[0], p=g.reduce((a,x)=>a+total(x),0);
    return `<div class="flight-block">
      <div class="flight-head">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <div class="flight-title">الرحلة: ${esc(b.flight)}</div>
          <div class="flight-info">الإقلاع: ${esc(b.time)}</div>
          <div class="flight-pax-highlight">إجمالي الركاب: ${p} (${g.length} باص)</div>
        </div>
        <div class="flight-countdown" data-live="${esc(b.id)}">${until(b)}</div>
      </div>
      <div class="buses-container">${g.map((x,i)=>busCard(x,i)).join('')}</div>
      <button class="add-bus-btn" data-action="addsame" data-id="${esc(b.id)}">+ إضافة باص جديد لنفس الرحلة</button>
    </div>`;
  }).join('') : '<div class="empty-msg">لا توجد باصات مسجلة في الفرز حالياً.</div>';

  $('done').innerHTML=done.length?done.slice().reverse().map(b=>{
    const waitMs=(b.doneAt?new Date(b.doneAt).getTime():Date.now())-created(b);
    const extras=Array.isArray(b.extra)?b.extra:[];
    return `<div class="dep-row">
      <div class="dep-info">
        <span class="dep-flight">الرحلة: ${esc(b.flight)} ${extras.length?`<span class="bus-tag shared" style="font-size:10px">مشترك</span>`:''}</span>
        <span class="dep-details">الركاب: ${total(b)}</span>
        <span class="dep-details">الإقلاع: ${esc(b.time)}</span>
        <span class="dep-details">وقت المغادرة: ${b.doneAt?formatArTime(b.doneAt):'—'} (انتظار: ${mins(waitMs)})</span>
      </div>
      <div class="dep-btns">
        <button data-action="restore" data-id="${esc(b.id)}">تراجع</button>
        <button style="border-color:#fecaca;color:#b91c1c" data-action="delete" data-id="${esc(b.id)}">حذف</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty-msg">سجل المغادرة فارغ.</div>';

  $('preview').textContent=report();
  tick();
}

function tick(){
  const lookup=new Map(buses.map(b=>[String(b.id),b]));
  document.querySelectorAll('[data-live]').forEach(el=>{const b=lookup.get(el.dataset.live);if(b)el.textContent=until(b)});
  document.querySelectorAll('[data-wait]').forEach(el=>{const b=lookup.get(el.dataset.wait);if(b)el.textContent=mins((b.done&&b.doneAt?new Date(b.doneAt).getTime():Date.now())-created(b))});

  const active=buses.filter(b=>!b.done);
  const upcoming=active.flatMap(b=>[
    {flight:b.flight,dep:dep(b)},
    ...(b.extra||[]).map(x=>({flight:x.flight,dep:Number(x.departure)||departure(x.time,created(b))}))
  ]).filter(x=>x.dep>Date.now()).sort((a,b)=>a.dep-b.dep);
  $('nextflight').textContent=upcoming.length?`الرحلة القادمة: ${upcoming[0].flight} (${mins(upcoming[0].dep-Date.now())})`:'—';

  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
  $('clock').textContent = new Intl.DateTimeFormat('ar-SA', options).format(new Date());
}

function report(){
  const a=buses.filter(b=>!b.done), done=buses.filter(b=>b.done), groups=groupBy(a);
  const d = new Intl.DateTimeFormat('ar-SA',{timeZone:'Asia/Riyadh',dateStyle:'short',timeStyle:'short'}).format(new Date());
  
  const lines = [
    'تقرير عمليات الساحات الخارجية - الفرز (T4)',
    'التاريخ والوقت: ' + d,
    '----------------------------------------',
    'إجمالي الباصات بالفرز: ' + a.length,
    'إجمالي الركاب: ' + a.reduce((n,b)=>n+total(b),0),
    'عدد الرحلات النشطة: ' + new Set(a.flatMap(b=>[b.flight,...(b.extra||[]).map(x=>x.flight)])).size,
    'إجمالي الباصات المغادرة: ' + done.length,
    '----------------------------------------',
    'تفاصيل الرحلات الحالية:'
  ];

  if (!groups.length) {
    lines.push('');
    lines.push('لا توجد باصات في منطقة الفرز حالياً.');
  } else {
    for (const g of groups) {
      const f = g[0];
      const hasShared = g.some(b => b.extra && b.extra.length > 0);

      lines.push('');
      lines.push(`رقم الرحلة: ${f.flight}`);
      lines.push(`وقت الإقلاع: ${f.time}`);
      
      if (g.length === 1 && !hasShared) {
        lines.push(`عدد الركاب: ${f.pax}`);
      } 
      else if (!hasShared) {
        const paxList = g.map(b => b.pax).join(' + ');
        const totalPax = g.reduce((sum, b) => sum + b.pax, 0);
        lines.push(`عدد الباصات: ${g.length}`);
        lines.push(`تفصيل الركاب: ${paxList}`);
        lines.push(`إجمالي الركاب: ${totalPax}`);
      } 
      else {
        lines.push(`عدد الباصات: ${g.length}`);
        g.forEach((b, i) => {
          const ex = Array.isArray(b.extra) ? b.extra : [];
          if (!ex.length) {
             lines.push(`- باص ${i+1}: ${b.pax} راكب`);
          } else {
             let sharedStr = ex.map(x => `${x.flight} (${x.pax} راكب)`).join(' ، ');
             lines.push(`- باص ${i+1}: ${b.pax} راكب`);
             lines.push(`  (مشترك مع: ${sharedStr})`);
             lines.push(`  إجمالي الباص: ${total(b)} راكب`);
          }
        });
      }
      lines.push('--------------------');
    }
  }
  return '\u200f' + lines.join('\n\u200f');
}

$('entry').addEventListener('submit',e=>{
  e.preventDefault();
  const flight=$('flight').value.trim().toUpperCase().replace(/\s+/g,''),time=$('time').value,pax=Number($('pax').value);
  if(!/^[A-Z0-9-\u0600-\u06FF]{2,14}$/.test(flight)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)||!Number.isInteger(pax)||pax<1||pax>150){
    alert('تأكد من إدخال البيانات بشكل صحيح');return;
  }
  buses.push({id:newId(),flight,time,pax,departure:departure(time,Date.now()),createdAt:Date.now(),done:false,extra:[]});
  if(!save()){buses.pop();return}
  e.target.reset();
  $('notice').textContent='تم تسجيل البيانات بنجاح';
  setTimeout(()=>{if($('notice'))$('notice').textContent=''},2500);
  render();
});

$('flight').addEventListener('input',()=>{
  const f=$('flight').value.trim().toUpperCase().replace(/\s+/g,'');
  const b=buses.find(b=>!b.done&&b.flight===f);
  if(b&&!$('time').value)$('time').value=b.time;
});

function action(e){
  const btn=e.target.closest('button[data-action]');
  if(!btn)return;
  const a=btn.dataset.action,b=buses.find(b=>String(b.id)===btn.dataset.id);
  if(!b)return;

  if(a==='addsame'){
    const val=prompt('تسجيل باص جديد للرحلة '+b.flight+'\nأدخل عدد الركاب فقط:');
    if(val===null)return;
    const pax=Number(val.trim());
    if(!Number.isInteger(pax)||pax<1||pax>150){alert('رقم غير صحيح');return}
    buses.push({id:newId(),flight:b.flight,time:b.time,pax,departure:dep(b),createdAt:Date.now(),done:false,extra:[]});
  }
  else if(a==='addextra'){
    const f=prompt('رقم الرحلة المشتركة:');if(f===null)return;
    const flight=f.trim().toUpperCase().replace(/\s+/g,'');
    if(!/^[A-Z0-9-\u0600-\u06FF]{2,18}$/.test(flight)){alert('رقم الرحلة غير صحيح');return}
    const time=prompt('وقت إقلاع الرحلة المشتركة (مثال 15:30):');if(time===null)return;
    if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time.trim())){alert('وقت غير صحيح');return}
    const val=prompt('عدد الركاب للرحلة المشتركة:');if(val===null)return;
    const pax=Number(val.trim());
    if(!Number.isInteger(pax)||pax<1||pax>150){alert('عدد ركاب غير صحيح');return}
    (b.extra||(b.extra=[])).push({flight,time:time.trim(),pax,departure:departure(time.trim(),created(b)),createdAt:Date.now()});
  }
  else if(a==='removeextra'){
    if(!confirm('تأكيد حذف الرحلة المشتركة؟'))return;
    b.extra.splice(Number(btn.dataset.index),1);
  }
  else if(a==='done'){ b.done=true; b.doneAt=new Date().toISOString(); }
  else if(a==='restore'){ b.done=false; delete b.doneAt; }
  else if(a==='delete'){
    if(!confirm('تأكيد حذف الباص من السجل نهائياً؟'))return;
    buses=buses.filter(x=>x!==b);
  }
  const old=localStorage.getItem(KEY);
  if(!save()){try{buses=JSON.parse(old||'[]')}catch(e){}return}
  render();
}

$('active').addEventListener('click',action);
$('done').addEventListener('click',action);

async function copy(){ try{await navigator.clipboard.writeText(report());alert('تم نسخ التقرير')}catch(e){prompt('انسخ التقرير:',report())} }
$('copy').onclick=copy;
$('share').onclick=async()=>{ if(navigator.share){try{await navigator.share({text:report()})}catch(e){}}else await copy(); };
$('backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(buses,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='landside-t4-backup.json';a.click(); setTimeout(()=>URL.revokeObjectURL(url),3000);
};
$('restorefile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const v=JSON.parse(await f.text());
    if(!Array.isArray(v)||!v.every(b=>b&&typeof b==='object'&&typeof b.flight==='string'&&typeof b.time==='string'))throw Error();
    if(!confirm('تنبيه: سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. هل أنت متأكد؟'))return;
    const old=buses;buses=v;
    if(!save()){buses=old;return}
    render();alert('تم استعادة البيانات بنجاح.');
  }catch(err){alert('ملف النسخة غير صحيح.')}
  finally{e.target.value=''}
});

render(); setInterval(tick,1000);
})();
</script>
